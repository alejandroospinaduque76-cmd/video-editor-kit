name: Founder counter
on:
  schedule:
    - cron: "0 11 * * *"   # 06:00 in Colombia, every day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: counter
  cancel-in-progress: false
jobs:
  counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Gumroad and update the counter
        run: python3 scripts/update_counter.py
      - name: Commit and push if the page changed
        run: |
          if git diff --quiet -- index.html; then echo "no change"; exit 0; fi
          git config user.name "counter-bot"
          git config user.email "counter-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Update founder slot counter (daily, from Gumroad)"
          git push
